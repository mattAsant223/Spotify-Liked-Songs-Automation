<!DOCTYPE html>
<html>
<head>
    <title>Spotify Liked Songs Playlist Sync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Spotify Liked Songs Playlist Sync</h1>
        <form action="{{ url_for('authorize') }}" method="post">
            <div class="form-group">
                <label for="playlist_id">Playlist link or ID:</label>
                <input type="text" id="playlist_id" name="playlist_id" required
                       placeholder="https://open.spotify.com/playlist/...">
                <label class="checkbox">
                    <input type="checkbox" name="remove_unliked">
                    Also remove songs from the playlist that are no longer liked
                </label>
                <button type="submit">Log in with Spotify &amp; Sync</button>
            </div>
        </form>
    </div>
</body>
</html>
